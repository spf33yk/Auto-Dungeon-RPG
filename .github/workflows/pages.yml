name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_ref:
        description: 'Optional committed source ref for deployment diagnosis (empty = current commit)'
        type: string
        default: ''

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.content_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v6
      - name: Check browser asset versions
        run: node scripts/update-assets.js --check
      - name: Run game tests
        run: node --test
      - name: Package committed game files
        run: |
          mkdir _site
          git archive HEAD -- .nojekyll index.html favicon.svg '*.js' '*.css' art | tar -xf - -C _site --exclude='*.test.js' --exclude='server.js' --exclude='scripts' --exclude='test-support'
          node --input-type=module -e 'import {readFileSync,existsSync} from "node:fs"; const html=readFileSync("_site/index.html","utf8"); const imports=JSON.parse(html.match(/<script type="importmap" id="asset-imports">([\s\S]*?)<\/script>/)[1]).imports; for(const path of Object.values(imports)){if(!existsSync("_site/"+path.split("?")[0])) throw Error("Missing browser module: "+path)}'
          if [ -z "$CONTENT_REF" ]; then
            node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("_site/deploy-version.json", JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID})+"\n")'
          fi
        env:
          CONTENT_REF: ${{ inputs.content_ref }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
