<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>本編描画・4方向確認</title>
<style>body{margin:24px;background:#14171d;color:#eee;font:16px system-ui}h1{font-size:24px}button,select{font:inherit;padding:8px;margin:4px;background:#313846;color:white;border:1px solid #697080;border-radius:5px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#20262f;text-align:center;padding:8px}canvas{width:100%;max-width:300px;image-rendering:pixelated}#status{min-height:24px}p{color:#bcc8d5}</style>
<h1>本編の描画処理で4方向を確認</h1><p>完成素材と本編の描画関数を使用。足元の十字は元の位置、輪は攻撃先。拡大率は縦横同一。</p>
<button id="idle">待機</button><button id="attack">攻撃を再生</button><button id="freeze">攻撃中間で停止</button><button id="death">死亡を再生</button><button id="half">死亡の中間で停止</button><button id="pause">一時停止／再開</button><label>速度<select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><label><input id="reduced" type="checkbox">動きを抑える</label><p id="status">読込中</p><div class="cards"></div>
<script type="module">
import {loadCharacterSheet,CharacterAnimation,drawCharacter,characterPresentation,characterAttackDuration} from '/character-animation.js';
const sheet=await loadCharacterSheet('/art/characters/mukuro-minimal64-v1/sprites.json'),vectors=[[0,1],[-1,0],[1,0],[0,-1]],names=['下・正面','左','右','上・背面'];
let actors=[],mode='idle',elapsed=0,paused=false,last=performance.now();
const cards=document.querySelector('.cards'),status=document.querySelector('#status'),speed=document.querySelector('#speed'),reduced=document.querySelector('#reduced');
const contexts=names.map(name=>{const card=document.createElement('article');card.innerHTML='<h2>'+name+'</h2><canvas width="384" height="432"></canvas>';cards.append(card);return card.querySelector('canvas').getContext('2d');});
function reset(next,freeze=false){mode=next;elapsed=0;paused=freeze;const duration=characterAttackDuration(sheet.definition,Number(speed.value));actors=vectors.map(([dx,dy],direction)=>{const actor=new CharacterAnimation({x:1,y:1,direction});if(next==='attack')actor.attackTo(1+dx,1+dy,0,duration);if(next==='death')actor.die(0);return actor;});if(freeze)elapsed=next==='attack'?duration*.45:390;}
document.querySelector('#idle').onclick=()=>reset('idle');document.querySelector('#attack').onclick=()=>reset('attack');document.querySelector('#freeze').onclick=()=>reset('attack',true);document.querySelector('#death').onclick=()=>reset('death');document.querySelector('#half').onclick=()=>reset('death',true);document.querySelector('#pause').onclick=()=>paused=!paused;speed.onchange=()=>reset(mode);reduced.onchange=()=>reset(mode,paused);
reset('idle');function frame(time){if(!paused)elapsed+=Math.min(100,time-last);last=time;contexts.forEach((ctx,i)=>{ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#20262f';ctx.fillRect(0,0,384,432);ctx.translate(0,0);ctx.scale(2,2);const [dx,dy]=vectors[i],sample=actors[i].sample(elapsed,{reducedMotion:reduced.checked}),visual=characterPresentation(sheet.definition,sample,64);ctx.strokeStyle='#353e4a';ctx.lineWidth=.5;for(let x=0;x<192;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,216);ctx.stroke();}for(let y=0;y<216;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(192,y);ctx.stroke();}ctx.strokeStyle='#9a7657';ctx.beginPath();ctx.arc(96+dx*64,112+dy*64,12,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#7ca8b4';ctx.beginPath();ctx.moveTo(90,128);ctx.lineTo(102,128);ctx.moveTo(96,122);ctx.lineTo(96,134);ctx.stroke();ctx.globalAlpha=visual.opacity*.35;ctx.fillStyle='black';ctx.beginPath();ctx.ellipse(96+visual.offsetX,128+visual.offsetY,20,6,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;drawCharacter(ctx,sheet,sample,1,1,64);});status.textContent=(mode==='attack'?'攻撃 '+characterAttackDuration(sheet.definition,Number(speed.value))+'ms':mode==='death'?'死亡 780ms':'待機 800ms周期')+' / '+(paused?'停止':'再生中')+' / '+Math.round(elapsed)+'ms';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
